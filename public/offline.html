<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#059669" />
<title>Offline — Darrell Soft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f6f7f6;
    color: #1c1917;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    body { background: #12100e; color: #f4f4f5; }
    .card { background: #1c1a19; border-color: #3f3f46; }
    .hint { color: #a1a1aa; }
    .status { color: #a1a1aa; }
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1px solid #e7e5e4;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
  }
  .icon {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    border-radius: 20px;
    background: #ecfdf5;
    display: flex; align-items: center; justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    .icon { background: #06281d; }
  }
  .icon svg { width: 30px; height: 30px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 14px; line-height: 1.6; }
  .hint { margin-top: 10px; color: #78716c; font-size: 13px; }
  button {
    margin-top: 22px;
    width: 100%;
    min-height: 48px;
    border: 0;
    border-radius: 12px;
    background: #059669;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
  .status { margin-top: 14px; font-size: 12px; color: #a8a29e; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #f59e0b; margin-right: 6px; vertical-align: middle;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Anda sedang offline</h1>
    <p>Tidak ada koneksi internet saat ini.</p>
    <p class="hint">Data yang sudah pernah dibuka di aplikasi tetap tersedia. Setelah internet tersambung kembali, aplikasi akan terhubung otomatis.</p>
    <button id="retry" type="button">Coba Sambungkan Ulang</button>
    <p class="status" id="status"><span class="dot"></span>Menunggu koneksi internet&hellip;</p>
  </main>
  <script>
    // Reload otomatis begitu kembali online — tanpa perlu reload manual
    window.addEventListener('online', function () { window.location.reload(); });
    document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });
    // Poll cadangan tiap 15 detik (halaman ini saja, sangat ringan)
    setInterval(function () {
      if (navigator.onLine) { window.location.reload(); }
    }, 15000);
  </script>
</body>
</html>
